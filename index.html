<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>class_uz · 학급 운영 양식 나눔</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<link rel="stylesheet" href="style.css?v=20261020">
<style>
  header { text-align: center; padding: 44px 16px 18px; }
  header .deco { font-size: 30px; letter-spacing: 10px; }
  header h1 { margin: 6px 0 0; font-size: clamp(44px, 10vw, 72px); line-height: 1; color: var(--ink); }
  header h1 span { color: var(--accent); }
  header p { margin: 10px 0 0; color: var(--muted); font-size: 17px; }
  body.me { --accent: #8C7CF0; --bg: #F7F5FF; --dot: #E6E0FA; --line: #E4DEF5; }

  .strips { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .strip { display: flex; flex-direction: column; gap: 4px; padding: 22px 22px 18px; min-height: 150px; border-radius: 26px; text-decoration: none;
           background: var(--tint); border: 2px solid transparent; box-shadow: var(--shadow); transition: transform .15s; }
  .strip:hover, .strip:focus-visible { transform: translateY(-3px) rotate(-1deg); border-color: var(--accent); outline: none; }
  .strip .big { font-size: 44px; line-height: 1; }
  .strip .sname { font-family: Jua, Paperlogy, sans-serif; font-size: 26px; margin-top: auto; }
  .strip .count { font-size: 14px; color: var(--ink); opacity: .65; }
  .crumb { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .crumb a { padding: 7px 16px; border-radius: 999px; background: var(--card); border: 2px solid var(--line); text-decoration: none; font-weight: 700; }
  .crumb a:hover, .crumb a:focus-visible { border-color: var(--accent); outline: none; }
  .crumb h2 { margin: 0; font-size: 28px; }
  input[type=search] { max-width: 520px; display: block; margin: 0 auto 22px; border-radius: 999px; padding: 12px 20px; }

  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); padding-bottom: 40px; }
  .card { position: relative; display: flex; gap: 14px; align-items: flex-start; background: var(--card); border: 2px solid var(--line);
          border-radius: 22px; padding: 16px; box-shadow: var(--shadow); transition: transform .15s; }
  .card:hover, .card:focus-within { transform: translateY(-3px); border-color: var(--accent); }
  .icon { flex: none; width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; font-size: 28px; background: var(--tint); }
  .text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .badge { font-size: 12px; color: var(--muted); }
  .name { font-weight: 700; font-size: 18px; text-decoration: none; overflow-wrap: anywhere; }
  .name:focus-visible { outline: none; }
  .name::after { content: ""; position: absolute; inset: 0; border-radius: 22px; } /* whole card clicks the main action */
  .desc { color: var(--muted); font-size: 14px; margin: 0; white-space: pre-line; }
  .act { flex: none; display: flex; flex-direction: column; gap: 6px; align-items: center; position: relative; z-index: 1; }
  .go { font-size: 13px; padding: 5px 12px; background: var(--tint); border-color: transparent; font-weight: 700; pointer-events: none; }
  .qr { width: 44px; height: 44px; padding: 2px; border-radius: 10px; background: #fff; cursor: zoom-in; }
  .qr svg, #qrBigCode svg { width: 100%; height: 100%; display: block; }
  .empty { text-align: center; color: var(--muted); padding: 32px; grid-column: 1 / -1; }

  #qrBig { border: none; border-radius: 28px; padding: 24px; text-align: center; max-width: min(92vw, 520px); background: #fff; color: #3D3553; }
  #qrBig::backdrop { background: #3D3553bb; }
  #qrBigCode { width: min(76vw, 440px); aspect-ratio: 1; margin: 0 auto 12px; }
  #qrBigTitle { display: block; font-size: 24px; }
  #qrBigUrl { display: block; color: #8A819C; word-break: break-all; margin: 4px 0 14px; }

  #login { max-width: 420px; margin: 0 auto 40px; }
  footer { text-align: center; color: var(--muted); font-size: 14px; padding: 8px 0 32px; }
  footer a { text-decoration: none; margin: 0 6px; opacity: .6; }
  footer a:hover, footer a:focus-visible { opacity: 1; }
</style>
</head>
<body>
<header>
  <div class="deco" aria-hidden="true" id="deco">🌱🐣🌷</div>
  <h1 class="title">class<span>_</span>uz</h1>
  <p id="sub">선생님들과 나누는 학급 운영 양식·링크 꾸러미</p>
</header>

<main class="wrap">
  <section class="panel" id="login" hidden>
    <b>🔒 내 공간</b>
    <label for="pw">비밀번호</label>
    <input type="password" id="pw" autocomplete="current-password">
    <div class="row" style="margin-top:12px"><button class="primary" id="loginBtn">열기</button></div>
    <p class="hint">처음이라면 <a href="admin.html">⚙️ 관리 화면</a>에서 비밀번호를 먼저 정해 주세요.</p>
  </section>
  <input type="search" id="q" placeholder="🔍 전체에서 이름이나 설명으로 찾기" aria-label="검색">
  <div class="crumb" id="crumb" hidden><a href="#">← 전체</a><h2 class="title" id="catTitle"></h2></div>
  <div class="grid" id="grid"></div>
</main>

<dialog id="qrBig" aria-label="QR 코드 크게 보기">
  <div id="qrBigCode"></div>
  <b id="qrBigTitle" class="title"></b>
  <small id="qrBigUrl"></small>
  <button id="qrClose">닫기</button>
</dialog>

<footer>made by @earth._.uz <a href="./" id="toPub">🌷 공유 화면</a><a href="?me" id="toMe">🔒 내 공간</a><a href="admin.html" title="관리 화면">⚙️</a></footer>

<script src="vendor/qrcode.js?v=1.4.4"></script>
<script src="common.js?v=20261020"></script>
<script>
const ME = new URLSearchParams(location.search).has("me");
let categories = [], items = [];
const OTHER = { id: "_other", name: "기타", emoji: "📦" };
const catOf = it => categories.find(c => c.id === it.cat) || OTHER;

qrcode.stringToBytes = qrcode.stringToBytesFuncs["UTF-8"]; // keep non-ASCII URLs intact
function qrSvg(url) {
  const q = qrcode(0, "M");
  q.addData(url);
  q.make();
  return q.createSvgTag({ scalable: true, margin: 2 });
}

const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };

// Personal files sit in a private repo, so they are fetched with the token instead of a plain link.
async function downloadPrivate(it, btn) {
  btn.querySelector(".go").textContent = "받는 중…";
  try { saveBlob(await gh(REPOS.me, it.file, {}, true), it.name || it.file); }
  catch (e) { alert("파일을 받지 못했어요: " + e.message); }
  btn.querySelector(".go").textContent = "⬇ 받기";
}

function card(it) {
  const cats = [...categories, OTHER];
  const c = catOf(it);
  const isFile = it.type === "file";
  const url = isFile ? "" : safeUrl(it.url);
  const main = isFile && ME
    ? el("a", { className: "name", href: "#", onclick: e => { e.preventDefault(); downloadPrivate(it, box); } }, it.title)
    : isFile
      ? el("a", { className: "name", href: it.file, download: it.name || "" }, it.title)
      : el("a", { className: "name", href: url || "#", target: "_blank", rel: "noopener" }, it.title);
  const box = el("article", { className: "card" },
    el("div", { className: "icon", ariaHidden: "true" }, it.emoji || c.emoji || "📌"),
    el("div", { className: "text" },
      el("span", { className: "badge" }, (isFile ? "📎 파일" + (ext(it.name || "") ? " · " + ext(it.name) : "") : "🔗 링크") + " · " + c.name),
      main,
      it.desc ? el("p", { className: "desc" }, it.desc) : ""),
    el("div", { className: "act" }, el("span", { className: "btn go" }, isFile ? "⬇ 받기" : "열기 ↗")));
  box.style.setProperty("--tint", tint(cats.indexOf(c)));
  if (url) {
    const qr = el("button", { className: "qr", title: "QR 크게 보기", onclick: () => showQr(it, url) });
    qr.setAttribute("aria-label", it.title + " QR 코드 크게 보기");
    qr.innerHTML = qrSvg(url);
    box.querySelector(".act").append(qr);
  }
  return box;
}

function showQr(it, url) {
  $("qrBigCode").innerHTML = qrSvg(url);
  $("qrBigTitle").textContent = it.title;
  $("qrBigUrl").textContent = url;
  $("qrBig").showModal();
}

function render() {
  const q = $("q").value.trim().toLowerCase();
  const id = decodeURIComponent(location.hash.slice(1));
  const all = [...categories, OTHER];
  const cats = all.filter(c => c !== OTHER || items.some(it => catOf(it) === OTHER));
  const current = cats.find(c => c.id === id);
  $("crumb").hidden = !current;
  if (current) $("catTitle").textContent = (current.emoji || "📌") + " " + current.name;
  $("q").placeholder = current ? "🔍 " + current.name + "에서 찾기" : "🔍 전체에서 이름이나 설명으로 찾기";

  if (!current && !q) { // home: one big tile per category
    $("grid").className = "grid strips";
    $("grid").replaceChildren(...cats.map(c => {
      const a = el("a", { className: "strip", href: "#" + encodeURIComponent(c.id) },
        el("span", { className: "big", ariaHidden: "true" }, c.emoji || "📌"),
        el("span", { className: "sname" }, c.name),
        el("span", { className: "count" }, items.filter(it => catOf(it) === c).length + "개"));
      a.style.setProperty("--tint", tint(all.indexOf(c)));
      return a;
    }));
    if (!cats.length) $("grid").append(el("p", { className: "empty" }, "아직 분류가 없어요 🌱"));
    return;
  }
  $("grid").className = "grid";
  const shown = items.filter(it => (!current || catOf(it) === current) && (it.title + " " + (it.desc || "")).toLowerCase().includes(q));
  $("grid").replaceChildren(...shown.map(card));
  if (!shown.length) $("grid").append(el("p", { className: "empty" }, q ? "찾는 게 없어요 🥲" : "아직 올라온 게 없어요 🌱"));
}

function fail(e) { console.error(e); $("grid").replaceChildren(el("p", { className: "empty" }, "목록을 불러오지 못했어요. 새로고침(Ctrl+F5)해 주세요.")); }

async function openMe() {
  try {
    const file = await gh(REPOS.me, "links.json");
    ({ categories, items } = normalize(JSON.parse(fromB64(file.content))));
    $("login").hidden = true;
    $("q").hidden = false;
    render();
  } catch (e) {
    store("gh_token", null);
    if (e.status === 401 || e.status === 403 || e.status === 404) {
      alert("토큰이 만료됐거나 개인 저장소 권한이 없어요. 관리 화면에서 토큰을 다시 설정해 주세요.");
      showLogin();
    } else fail(e);
  }
}

function showLogin() { $("login").hidden = false; $("q").hidden = true; $("pw").focus(); }

async function login() {
  if (!$("pw").value) return;
  $("loginBtn").disabled = true;
  try { store("gh_token", await unlock($("pw").value)); openMe(); }
  catch (e) { alert(e.message === "wrong" ? "비밀번호가 틀렸어요." : "열지 못했어요: " + e.message); }
  finally { $("loginBtn").disabled = false; }
}

$("q").addEventListener("input", render);
$("qrClose").onclick = () => $("qrBig").close();
$("qrBig").addEventListener("click", e => { if (e.target === $("qrBig")) $("qrBig").close(); }); // backdrop click
addEventListener("hashchange", () => { $("q").value = ""; render(); scrollTo(0, 0); });
monkeyEyes();

$("toPub").hidden = !ME;
$("toMe").hidden = ME;
if (ME) {
  document.body.classList.add("me");
  document.title = "class_uz · 내 공간";
  $("sub").textContent = "🔒 나만 보는 공간이에요";
  $("deco").textContent = "🔒🐰📒";
  $("loginBtn").onclick = login;
  $("pw").addEventListener("keydown", e => e.key === "Enter" && login());
  load("gh_token") ? openMe() : showLogin();
} else {
  fetch("links.json", { cache: "no-cache" })
    .then(r => r.json())
    .then(d => { ({ categories, items } = normalize(d)); render(); })
    .catch(fail);
}
</script>
</body>
</html>
